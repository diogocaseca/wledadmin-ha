configuration:
  ingress:
    name: Sidebar access (Ingress)
    description: >-
      Allows opening WLED Admin from the Home Assistant sidebar without an extra login.
      When off, only direct access on port 8000 (with the WLED Admin login) works.
  ssl:
    name: HTTPS on direct access
    description: >-
      Serves HTTPS on the direct access port, using the certificate from the Home
      Assistant /ssl folder (e.g. from the DuckDNS app). When on, http:// on that port
      stops working. The sidebar panel is not affected.
  certfile:
    name: Certificate file
    description: File name in /ssl (DuckDNS default, fullchain.pem).
  keyfile:
    name: Private key file
    description: File name in /ssl (DuckDNS default, privkey.pem).
  log_level:
    name: Log level
    description: Amount of detail in the app log.
  scan_subnets:
    name: IP ranges to scan
    description: >-
      Ranges suggested in the UI to find devices without mDNS, as comma-separated CIDR
      (e.g. 192.168.1.0/24).
  github_token:
    name: GitHub token (optional)
    description: >-
      Only needed if firmware release lookups exceed the GitHub API limit of 60 requests
      per hour. A token without extra permissions is enough.
network:
  8000/tcp: Direct access port (with the WLED Admin login). Leave empty to disable direct access and use only the sidebar.
